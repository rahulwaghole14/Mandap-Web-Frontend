<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Registrations - Mandapam Admin</title>
    <link rel="icon" type="image/png" href="assets/images/mandapam-logo.png" />
    <link rel="apple-touch-icon" href="assets/images/mandapam-logo.png" />
    <link href="css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-gray-100 font-sans antialiased text-gray-900">
    <div class="flex">
      <!-- Sidebar -->
      <div class="w-64 bg-gray-900 text-white h-screen flex flex-col sticky top-0 flex-shrink-0" style="width: 256px; min-width: 256px; max-width: 256px;">
        <!-- Header -->
        <div class="p-6 border-b border-gray-700">
          <h2 class="text-xl font-semibold text-white">Mandapam Admin</h2>
          <p class="text-sm text-gray-400 mt-1">Association Platform</p>
        </div>

        <!-- User Info -->
        <div class="p-4 border-b border-gray-700">
          <div class="flex items-center space-x-3">
            <div class="h-10 w-10 bg-primary-600 rounded-full flex items-center justify-center">
              <i data-lucide="user" class="h-5 w-5 text-white"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-white truncate" id="user-name">
                Admin User
              </p>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 p-4 space-y-2">
          <a href="dashboard.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Dashboard</span>
          </a>
          <a href="vendors.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="users" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Vendors</span>
          </a>
          <a href="events.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="calendar" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Events</span>
          </a>
          <a href="event-registrations.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors bg-primary-600 text-white">
            <i data-lucide="clipboard-list" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Registrations</span>
          </a>
          <a href="nbod.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="award" class="h-5 w-5"></i>
            <span class="text-sm font-medium">NBOD</span>
          </a>
          <a href="members.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="building" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Members</span>
          </a>
          <a href="associations.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="map-pin" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Associations</span>
          </a>
        </nav>

        <!-- Footer -->
        <div class="p-4 border-t border-gray-700 space-y-2">
          <a href="settings.html" class="flex items-center space-x-3 px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
            <i data-lucide="settings" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Settings</span>
          </a>
          <button id="logout-btn" class="w-full flex items-center space-x-3 px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
            <i data-lucide="log-out" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Logout</span>
          </button>
        </div>
      </div>

      <!-- Main Content -->
      <main class="flex-1 p-8 bg-gray-100 min-h-screen overflow-x-auto">
        <div class="space-y-6">
          
          <div class="flex justify-between items-center">
            <div>
              <h1 class="text-3xl font-bold text-gray-900">Event Registrations</h1>
              <p class="text-gray-600 mt-2">Showing <span id="showing-count">0</span> of <span id="total-count">0</span> registrations</p>
            </div>
            <div class="flex space-x-3">
              <button id="refresh-btn" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors flex items-center space-x-2">
                <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                <span>Refresh</span>
              </button>
              <button id="export-btn" class="px-4 py-2 border border-gray-300 bg-white text-gray-700 rounded-lg hover:bg-gray-50 transition-colors flex items-center space-x-2">
                <i data-lucide="download" class="h-4 w-4"></i>
                <span>Export CSV</span>
              </button>
            </div>
          </div>

          <!-- Advanced Filters -->
          <div class="bg-white rounded-lg shadow p-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Search</label>
                <div class="relative">
                  <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 h-4 w-4"></i>
                  <input
                    id="search-registrations"
                    type="text"
                    placeholder="Name, Phone, Email..."
                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                  />
                </div>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Event</label>
                <select id="filter-event" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                  <option value="">All Events</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                <select id="filter-status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                  <option value="">All Statuses</option>
                  <option value="registered">Registered</option>
                  <option value="attended">Attended</option>
                  <option value="cancelled">Cancelled</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Payment</label>
                <select id="filter-payment" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                  <option value="">All Payments</option>
                  <option value="paid">Paid</option>
                  <option value="pending">Pending</option>
                  <option value="failed">Failed</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Registrations Table -->
          <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Registration Info</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Event Details</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Payment</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                  </tr>
                </thead>
                <tbody id="registrations-table-body" class="bg-white divide-y divide-gray-200">
                  <!-- Populated dynamically by event-registrations.js -->
                </tbody>
              </table>
            </div>

            <!-- Pagination (Mock) -->
            <div class="bg-white px-4 py-3 border-t border-gray-200 flex items-center justify-between sm:px-6">
              <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                <div>
                  <p class="text-sm text-gray-700">
                    Showing <span class="font-medium">1</span> to <span class="font-medium">2</span> of <span class="font-medium">97</span> results
                  </p>
                </div>
                <div>
                  <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                    <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                      Previous
                    </a>
                    <a href="#" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
                      1
                    </a>
                    <a href="#" class="relative inline-flex items-center px-4 py-2 border border-primary-500 bg-primary-50 text-sm font-medium text-primary-600">
                      2
                    </a>
                    <a href="#" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
                      3
                    </a>
                    <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                      Next
                    </a>
                  </nav>
                </div>
              </div>
            </div>

          </div>

        </div>
      </main>
    </div>

    <!-- config must load first so API_BASE_URL is available to page scripts -->
    <script src="js/config.js"></script>
    <script src="js/pages/event-registrations.js"></script>
    <script>
      // Init sidebar/filter icons (table icons are created by the JS module)
      if (window.lucide) lucide.createIcons();
    </script>
  </body>
</html>
