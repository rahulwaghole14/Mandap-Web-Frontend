<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanner App - Mandapam Check-In</title>
    <link rel="icon" type="image/png" href="assets/images/mandapam-logo.png" />
    <link rel="apple-touch-icon" href="assets/images/mandapam-logo.png" />
    <link href="css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  </head>
  <body class="bg-gray-900 font-sans antialiased text-white min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex justify-between items-center shadow-md">
      <div class="flex items-center space-x-2">
        <i data-lucide="scan" class="h-6 w-6 text-primary-500"></i>
        <h1 class="text-xl font-bold text-white">Scanner / Gate</h1>
      </div>
      <div>
        <a href="dashboard.html" class="text-sm text-gray-400 hover:text-white flex items-center">
          <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i> Exit
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center p-4">
      
      <div class="w-full max-w-md bg-gray-800 rounded-xl shadow-xl overflow-hidden mt-4 border border-gray-700">
        <div class="p-4 border-b border-gray-700 text-center">
          <h2 class="text-lg font-semibold">Scan Ticket QR Code</h2>
          <p class="text-sm text-gray-400">Point your camera at the visitor pass</p>
        </div>
        
        <!-- Scanner Viewport -->
        <div class="relative w-full aspect-square bg-black">
          <div id="reader" class="w-full h-full"></div>
          
          <!-- Scan Animation Overlay -->
          <div id="scan-overlay" class="absolute inset-0 pointer-events-none hidden flex items-center justify-center bg-black bg-opacity-70 z-10">
            <div class="text-center">
              <i data-lucide="loader-2" class="h-10 w-10 animate-spin mx-auto text-primary-500 mb-2"></i>
              <p class="text-sm font-medium">Verifying Ticket...</p>
            </div>
          </div>
        </div>

        <div class="p-4 flex justify-between space-x-2">
          <button id="camera-swap-btn" class="flex-1 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium flex justify-center items-center">
            <i data-lucide="camera" class="h-4 w-4 mr-2"></i> Switch Camera
          </button>
          <button id="manual-entry-btn" class="flex-1 py-2 border border-gray-600 hover:bg-gray-700 rounded-lg text-sm font-medium flex justify-center items-center">
            <i data-lucide="keyboard" class="h-4 w-4 mr-2"></i> Manual Entry
          </button>
        </div>
      </div>

      <!-- Result Banner -->
      <div id="result-banner" class="w-full max-w-md mt-6 rounded-xl p-4 hidden transform transition-all duration-300">
        <div class="flex items-start">
          <div id="result-icon" class="flex-shrink-0 mr-3 mt-1"></div>
          <div class="flex-1">
            <h3 id="result-title" class="text-lg font-bold"></h3>
            <p id="result-message" class="text-sm mt-1"></p>
            <div id="result-details" class="mt-3 bg-white bg-opacity-10 p-3 rounded-lg hidden"></div>
          </div>
        </div>
        <button id="scan-next-btn" class="w-full mt-4 py-2 bg-white text-gray-900 font-bold rounded-lg hover:bg-gray-200 hidden">
          Scan Next Ticket
        </button>
      </div>

    </main>

    <!-- Manual Entry Modal -->
    <div id="manual-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
      <div class="bg-gray-800 rounded-xl w-full max-w-sm border border-gray-700 shadow-2xl overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-700 flex justify-between items-center">
          <h3 class="font-semibold text-white">Manual Check-In</h3>
          <button id="close-manual-modal" class="text-gray-400 hover:text-white">
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
        </div>
        <div class="p-4">
          <label class="block text-sm text-gray-400 mb-1">Enter QR Reference Code</label>
          <input type="text" id="manual-code-input" class="w-full p-3 bg-gray-900 border border-gray-600 rounded-lg text-white font-mono focus:border-primary-500 focus:ring-1 focus:ring-primary-500 mb-4" placeholder="EVT-...">
          
          <button id="submit-manual-code" class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-lg">
            Verify Ticket
          </button>
        </div>
      </div>
    </div>

    <script>lucide.createIcons();</script>
    <script src="js/config.js"></script>
    <script src="js/utils/api.js?v=4"></script>
    <script src="js/pages/scanner.js"></script>
  </body>
</html>
