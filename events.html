<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events - Mandapam Admin</title>
    <link rel="icon" type="image/png" href="assets/images/mandapam-logo.png" />
    <link rel="apple-touch-icon" href="assets/images/mandapam-logo.png" />
    <link href="css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-gray-100 font-sans antialiased text-gray-900">
    <div class="flex">
      <!-- Sidebar -->
      <div class="w-64 bg-gray-900 text-white h-screen flex flex-col sticky top-0 flex-shrink-0" style="width: 256px; min-width: 256px; max-width: 256px;">
        <!-- Header -->
        <div class="p-6 border-b border-gray-700">
          <h2 class="text-xl font-semibold text-white">Mandapam Admin</h2>
          <p class="text-sm text-gray-400 mt-1">Association Platform</p>
        </div>

        <!-- User Info -->
        <div class="p-4 border-b border-gray-700">
          <div class="flex items-center space-x-3">
            <div class="h-10 w-10 bg-primary-600 rounded-full flex items-center justify-center">
              <i data-lucide="user" class="h-5 w-5 text-white"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-white truncate" id="user-name">
                Admin User
              </p>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 p-4 space-y-2">
          <a href="dashboard.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Dashboard</span>
          </a>
          <a href="vendors.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="users" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Vendors</span>
          </a>
          <a href="events.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors bg-primary-600 text-white">
            <i data-lucide="calendar" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Events</span>
          </a>
          <a href="nbod.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="award" class="h-5 w-5"></i>
            <span class="text-sm font-medium">NBOD</span>
          </a>
          <a href="members.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="building" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Members</span>
          </a>
          <a href="associations.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-800 hover:text-white">
            <i data-lucide="map-pin" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Associations</span>
          </a>
        </nav>

        <!-- Footer -->
        <div class="p-4 border-t border-gray-700 space-y-2">
          <a href="settings.html" class="flex items-center space-x-3 px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
            <i data-lucide="settings" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Settings</span>
          </a>
          <button id="logout-btn" class="w-full flex items-center space-x-3 px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
            <i data-lucide="log-out" class="h-5 w-5"></i>
            <span class="text-sm font-medium">Logout</span>
          </button>
        </div>
      </div>

      <!-- Main Content -->
      <main class="flex-1 p-8 bg-gray-100 min-h-screen overflow-x-auto">
        <div class="space-y-6">
          
          <div class="flex justify-between items-center">
            <div>
              <h1 class="text-3xl font-bold text-gray-900">Events Management</h1>
              <p class="text-gray-600 mt-2">Create and manage association events</p>
            </div>
            <div class="flex space-x-3">
              <button id="refresh-btn" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors flex items-center space-x-2">
                <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                <span>Refresh</span>
              </button>
              <a href="event-form.html" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors flex items-center space-x-2">
                <i data-lucide="plus" class="h-4 w-4"></i>
                <span>Create Event</span>
              </a>
            </div>
          </div>

          <!-- Filters -->
          <div class="bg-white rounded-lg shadow p-6">
            <div class="flex flex-wrap gap-4 items-center">
              <div class="flex-1 min-w-64">
                <div class="relative">
                  <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 h-4 w-4"></i>
                  <input
                    id="search-input"
                    type="text"
                    placeholder="Search events..."
                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                  />
                </div>
              </div>
              <select id="type-filter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="">All Types</option>
                <option value="Meeting">Meeting</option>
                <option value="Workshop">Workshop</option>
                <option value="Conference">Conference</option>
              </select>
              <select id="location-filter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="">All Locations</option>
                <option value="Pune">Pune</option>
                <option value="Mumbai">Mumbai</option>
              </select>
            </div>
          </div>

          <!-- Event Grid -->
          <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Populated by JS -->
          </div>
          
        </div>
      </main>
    </div>

    <!-- Modals Background Overlay (Hidden by default) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden flex items-center justify-center">
      <!-- Delete Confirmation Modal -->
      <div id="delete-modal" class="bg-white rounded-lg shadow-xl w-full max-w-md hidden">
        <div class="p-6 text-center">
          <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
            <i data-lucide="alert-triangle" class="h-6 w-6 text-red-600"></i>
          </div>
          <h3 class="text-lg font-medium text-gray-900 mb-2">Delete Event</h3>
          <p class="text-sm text-gray-500 mb-6">Are you sure you want to delete this event? This action cannot be undone.</p>
          <div class="flex justify-center space-x-3">
            <button id="cancel-delete-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
              Cancel
            </button>
            <button id="confirm-delete-btn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
      lucide.createIcons();
    </script>
    <script src="js/config.js"></script>
    <script src="js/pages/events.js"></script>
  </body>
</html>
